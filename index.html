<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="description" content="Personal dumbbell-focused fitness & food tracker" />
  <title>Gym Buddy</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">GB</span>
        <span class="brand-text">Gym Buddy</span>
      </div>
      <div class="topbar-right">
        <span id="streak-pill" class="pill" title="Workout streak">🔥 0</span>
        <button id="install-btn" class="ghost-btn" hidden>Install</button>
      </div>
    </div>
  </header>

  <main id="view" class="view"><!-- rendered by app.js --></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-route="today" aria-label="Today">
      <span class="tab-ico">📅</span><span class="tab-lbl">Today</span>
    </button>
    <button class="tab" data-route="workouts" aria-label="Workouts">
      <span class="tab-ico">🏋️</span><span class="tab-lbl">Workouts</span>
    </button>
    <button class="tab" data-route="weight" aria-label="Weight">
      <span class="tab-ico">⚖️</span><span class="tab-lbl">Weight</span>
    </button>
    <button class="tab" data-route="food" aria-label="Food">
      <span class="tab-ico">🍽️</span><span class="tab-lbl">Food</span>
    </button>
    <button class="tab" data-route="settings" aria-label="More">
      <span class="tab-ico">⚙️</span><span class="tab-lbl">More</span>
    </button>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <script src="program.js"></script>
  <script src="app.js"></script>
</body>
</html>
